<section>
  <div class="filters">
    <button
      type="button"
      [class.active]="selectedStatuses.includes('REGISTERED')"
      (click)="toggleStatus('REGISTERED')"
    >
      Registered
    </button>
    <button
      type="button"
      [class.active]="selectedStatuses.includes('DEREGISTERED')"
      (click)="toggleStatus('DEREGISTERED')"
    >
      Deregistered
    </button>
    <label>
      Start date (on or after)
      <input #startDateInput type="date" [value]="startDateFilter"
        (input)="startDateFilter = startDateInput.value">
    </label>
    <label>
      End date (on or before)
      <input #endDateInput type="date" [value]="endDateFilter"
        (input)="endDateFilter = endDateInput.value">
    </label>
  </div>

  <p class="filter-scope">Filters and sorting apply to the current page.</p>

  <table>
    <thead>
      <tr>
        <th>UUID</th>
        <th>Brand</th>
        <th>Type</th>
        <th>Status</th>
        <th>Start Date</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let v of filteredVehicles()" (click)="open(v)" tabindex="0"
        (keydown.enter)="open(v)" (keydown.space)="$event.preventDefault(); open(v)"
        [attr.aria-label]="'Open details for ' + v.uuid">
        <td>{{ v.uuid.substring(0, 8) }}</td>
        <td>{{ v.brand }}</td>
        <td>{{ v.type }}</td>
        <td>{{ v.status }}</td>
        <td>{{ v.startDate | date: 'dd MMM yyyy' }}</td>
        <td>{{ v.category }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="filteredVehicles().length === 0" role="status">No matching records on this page.</p>

  <div class="pager">
    <button type="button" (click)="prevPage()" [disabled]="page === 0">Previous</button>
    <span>Page {{ page + 1 }}</span>
    <button type="button" (click)="nextPage()">Next</button>
  </div>

  <p *ngIf="popupMessage" role="alert">{{ popupMessage }}</p>
</section>
