server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

spring:
  application:
    name: vrls2-api
  jackson:
    serialization:
      write-dates-as-timestamps: false

vrls:
  data-dir: ../../data
